locale          : "en-US"
title           : "Geyi Yang"
title_separator : "-"
name            : "Geyi Yang"
description     : "Undergraduate researcher at CUHK-Shenzhen interested in LLM-based agents, GUI agents, self-improving agentic systems, harness optimization, and RAG."
url             : "https://garyyang12345.github.io"
baseurl         : ""
repository      : "GaryYang12345/GaryYang12345.github.io"

author:
  avatar      : "avatar1.jpg"
  name        : "Geyi Yang"
  bio         : "B.Eng. Computer Engineering, CUHK-Shenzhen."
  location    : "Shenzhen, China"
  employer    : "CUHK-Shenzhen"
  email       : "123090721@link.cuhk.edu.cn"
  github      : "GaryYang12345"
  huggingface : "GaryYang123"

breadcrumbs : false

analytics:
  provider: false

include:
  - _pages
  - files

exclude:
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - Gemfile
  - LICENSE
  - README.md
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - node_modules
  - package.json
  - tmp
  - vendor

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      comments: false
      share: false
      related: false
      read_time: false

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Asia/Shanghai

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

compress_html:
  clippings: all
  ignore:
    envs: development
